# Install as /etc/systemd/system/kungfu-go.service.d/30-logging.conf.
# Prepare /opt/kungfu-go/logs owned by the service user before restarting.
# Takes effect on the NEXT authorized restart; do not restart automatically.
[Service]
Environment=OPENKFO_TRACE_PROTOCOL=0
Environment=OPENKFO_SECURITY_LOG_DIR=/opt/kungfu-go/logs/security
ReadWritePaths=/opt/kungfu-go/logs
